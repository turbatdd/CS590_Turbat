spring.application.name=stock-service
server.port=8900

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true

spring.cloud.consul.discovery.service-name=stock-service
spring.cloud.consul.discovery.instance-id=stock-service-${server.port}

logging.level.io.micrometer.tracing=DEBUG
logging.level.io.opentelemetry=DEBUG

logging.level.org.springframework.cloud.consul=TRACE
logging.level.org.springframework.cloud.client.serviceregistry=DEBUG