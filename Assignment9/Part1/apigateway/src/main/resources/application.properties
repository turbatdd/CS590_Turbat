spring.application.name=apigateway
server.port=8080

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8501
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.service-name=ApiGateway

spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://ProductService
spring.cloud.gateway.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.routes[1].id=stock-service
spring.cloud.gateway.routes[1].uri=lb://StockService
spring.cloud.gateway.routes[1].predicates[0]=Path=/stock/**

spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

management.endpoints.web.exposure.include=health,info