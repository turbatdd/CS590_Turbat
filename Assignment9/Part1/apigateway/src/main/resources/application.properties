spring.application.name=apigateway
server.port=8080

spring.cloud.config.enabled=false

# Consul
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.service-name=apigateway

spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[1].id=stock-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://stock-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/stock/**

spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

management.endpoints.web.exposure.include=health,info